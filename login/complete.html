<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>가입 마무리 · AuthHub</title>
  <link rel="stylesheet" href="./complete.css" />
  <script src="../config.js"></script>
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="title">
      <header><div><b>AUTHHUB</b><p id="project">계정 연결</p></div><button id="exit" type="button">나가기</button></header>
      <div class="progress" aria-hidden="true"><i></i><i id="p2"></i></div>
      <h1 id="title">거의 다 됐어요</h1>
      <p id="subtitle">기록을 안전하게 보관하고 계정을 복구할 수 있도록 이메일 주소 하나만 확인할게요.</p>
      <div id="error" class="error" role="alert" hidden></div>

      <section id="email-step">
        <form id="email-form">
          <label>이메일<input id="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required /></label>
          <button id="send" class="primary" type="submit">인증메일 보내기</button>
        </form>
        <p class="hint">추가 비밀번호는 만들지 않습니다. 이메일 소유 여부만 확인해요.</p>
      </section>

      <section id="code-step" hidden>
        <p class="sent">인증번호를 보냈어요.</p>
        <strong id="masked"></strong>
        <form id="code-form">
          <label>6자리 인증번호<input id="code" class="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" enterkeyhint="done" required /></label>
          <button id="verify" class="primary" type="submit">확인하고 시작하기</button>
        </form>
        <div class="links"><button id="resend" type="button">인증번호 다시 받기</button><button id="change" type="button">다른 이메일 사용</button></div>
      </section>

      <section id="expired-step" hidden>
        <p class="expired-copy">로그인 시간이 만료됐어요. 다시 로그인하면 같은 카카오 계정에서 이어서 진행할 수 있어요.</p>
        <button id="restart" class="primary" type="button">다시 로그인</button>
      </section>
      <p class="security">인증은 AuthHub에서 처리되며 비밀번호와 토큰을 서비스 화면에 노출하지 않습니다.</p>
    </section>
  </main>
  <script type="module" src="./complete.js"></script>
</body>
</html>
