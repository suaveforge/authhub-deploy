name: AuthHub Password Email Verification Finalize Once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/authhub-password-email-verification-finalize-once.yml']

permissions:
  contents: write

concurrency:
  group: authhub-password-email-verification-finalize-deploy
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch deployed AuthHub assets to canonical verified-email flow
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected one match, got {n}')
              p.write_text(s.replace(old,new,1))

          replace_once('login/hosted-login.js',
            "    const body=signup?{email:els.email.value.trim(),password:els.password.value,displayName:els.display.value.trim()}:{email:els.email.value.trim(),password:els.password.value};",
            "    const body=signup?{email:els.email.value.trim(),password:els.password.value,displayName:els.display.value.trim(),redirectUri,state}:{email:els.email.value.trim(),password:els.password.value,redirectUri,state};",
            'hosted login request body')
          replace_once('login/hosted-login.js',
            "    const session=await request(path,{method:'POST',body:JSON.stringify(body)});\n    if(session?.pendingApproval){showNotice(c.pending);return;}",
            "    const session=await request(path,{method:'POST',body:JSON.stringify(body)});\n    if(session?.verificationRequired){await completion.enter('');return;}\n    if(session?.pendingApproval){showNotice(c.pending);return;}",
            'hosted login verification branch')

          replacements={
            "emailHelp:'로그인용 비밀번호는 만들지 않습니다. 이메일 소유 여부만 확인해요.'":"emailHelp:'입력한 이메일의 소유 여부를 확인해요.'",
            "expiredSubtitle:'다시 카카오 로그인을 하면 같은 계정에서 이어서 진행할 수 있어요.'":"expiredSubtitle:'다시 로그인하면 같은 계정에서 이어서 진행할 수 있어요.'",
            "emailHelp:'No extra password is required. We only verify that you own this email.'":"emailHelp:'We only verify that you own this email address.'",
            "expiredSubtitle:'Sign in with your social account again to resume with the same account.'":"expiredSubtitle:'Sign in again to resume with the same account.'"
          }
          p=Path('login/profile-completion.js'); s=p.read_text()
          for old,new in replacements.items():
              n=s.count(old)
              if n!=1: raise SystemExit(f'profile completion replacement expected one match for {old!r}, got {n}')
              s=s.replace(old,new,1)
          p.write_text(s)

          old='v20260909-222000-KST'; new='v20260909-233000-KST'
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() in {'.png','.jpg','.jpeg','.webp','.gif','.ico','.woff','.woff2'}: continue
              try: text=p.read_text()
              except UnicodeDecodeError: continue
              if old in text: p.write_text(text.replace(old,new))
          Path('BUILD_VERSION.txt').write_text(new+'\n')
          PY
          node --check login/hosted-login.js
          node --check login/profile-completion.js
          grep -Fq 'session?.verificationRequired' login/hosted-login.js
          grep -Fq 'redirectUri,state' login/hosted-login.js
          grep -Fq '입력한 이메일의 소유 여부를 확인해요.' login/profile-completion.js
          test "$(tr -d '\r\n' < BUILD_VERSION.txt)" = 'v20260909-233000-KST'
          echo DEPLOY_ASSET_PATCH_OK=yes

      - name: Commit deployed assets
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo DEPLOY_ASSETS_ALREADY_CURRENT=yes
          else
            git commit -m 'Deploy AuthHub verified email password flow'
            git push origin HEAD:main
            echo DEPLOY_ASSET_PUSH_OK=yes
          fi

      - name: Wait for live Pages assets
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 80); do
            V="$(curl -fsS https://authhub.suaveforge.com/BUILD_VERSION.txt 2>/dev/null | tr -d '\r\n' || true)"
            JS="$(curl -fsS https://authhub.suaveforge.com/login/hosted-login.js 2>/dev/null || true)"
            if [ "$V" = 'v20260909-233000-KST' ] && grep -Fq 'session?.verificationRequired' <<<"$JS"; then break; fi
            sleep 3
            [ "$i" -lt 80 ] || { echo "LIVE_ASSET_WAIT_FAILED version=$V"; exit 40; }
          done
          curl -fsS https://authhub.suaveforge.com/login/profile-completion.js | grep -Fq '입력한 이메일의 소유 여부를 확인해요.'
          echo LIVE_AUTHHUB_ASSETS_OK=yes

      - name: Live desktop and mobile verification-stage QA
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const failures=[]; const check=(v,m)=>{if(!v)failures.push(m)};
          const cors={'access-control-allow-origin':'https://authhub.suaveforge.com','access-control-allow-credentials':'true','access-control-allow-headers':'content-type,authorization','access-control-allow-methods':'GET,POST,OPTIONS','content-type':'application/json; charset=utf-8'};
          for(const viewport of [{width:1440,height:1000},{width:390,height:844}]){
            const page=await browser.newPage({viewportSize:viewport}); const errors=[]; page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.route('**/v1/auth/p42/signup*',async route=>{
              if(route.request().method()==='OPTIONS')return route.fulfill({status:204,headers:cors,body:''});
              return route.fulfill({status:202,headers:cors,body:JSON.stringify({verificationRequired:true,emailVerified:false,challenge:null,user:{id:'qa',email:'qa@example.com',emailVerified:false,displayName:'QA',avatarUrl:''},membership:{role:'user',status:'active'}})});
            });
            await page.route('**/v1/auth/p42/profile-completion/status*',async route=>route.fulfill({status:200,headers:cors,body:JSON.stringify({ok:true,requirements:['verified_email'],challenge:null,user:{id:'qa',email:'qa@example.com',emailVerified:false,displayName:'QA',avatarUrl:''}})}));
            const u=new URL('https://authhub.suaveforge.com/login/'); u.searchParams.set('project','p42'); u.searchParams.set('environment','production'); u.searchParams.set('redirect_uri','https://nuguradar.suaveforge.com/'); u.searchParams.set('mode','signup'); u.searchParams.set('lang','ko');
            await page.goto(u.href,{waitUntil:'networkidle',timeout:30000}); await page.waitForSelector('#email-form:not([hidden])',{timeout:15000});
            const before=await page.evaluate(()=>({form:getComputedStyle(document.querySelector('#email-form')).display,completion:getComputedStyle(document.querySelector('#completion-section')).display,name:getComputedStyle(document.querySelector('#display-name-row')).display,overflow:document.documentElement.scrollWidth>innerWidth+1}));
            check(before.form!=='none',`${viewport.width}: signup form missing`); check(before.completion==='none',`${viewport.width}: completion visible before submit`); check(before.name!=='none',`${viewport.width}: display name missing`); check(!before.overflow,`${viewport.width}: overflow before submit`);
            await page.fill('#display-name','QA User'); await page.fill('#email','qa@example.com'); await page.fill('#password','StrongPass-12345!'); await page.click('#submit-button');
            await page.waitForFunction(()=>getComputedStyle(document.querySelector('#completion-section')).display!=='none',{timeout:10000});
            const after=await page.evaluate(()=>({form:getComputedStyle(document.querySelector('#email-form')).display,completion:getComputedStyle(document.querySelector('#completion-section')).display,emailStep:getComputedStyle(document.querySelector('#completion-email-step')).display,title:document.querySelector('#auth-title')?.textContent?.trim(),href:location.href,overflow:document.documentElement.scrollWidth>innerWidth+1}));
            check(after.form==='none',`${viewport.width}: signup form remained visible`); check(after.completion!=='none',`${viewport.width}: completion UI missing`); check(after.emailStep!=='none',`${viewport.width}: email verification step missing`); check(after.title==='거의 다 됐어요',`${viewport.width}: title mismatch ${after.title}`); check(after.href.startsWith('https://authhub.suaveforge.com/login/'),`${viewport.width}: navigated away before verification`); check(!after.overflow,`${viewport.width}: overflow after submit`); check(errors.length===0,`${viewport.width}: page errors ${errors.join(' | ')}`);
            await page.close();
          }
          await browser.close(); if(failures.length){console.error(failures.join('\n'));process.exit(1)} console.log('AUTHHUB_PASSWORD_EMAIL_VERIFICATION_LIVE_BROWSER_QA_OK=yes');
          NODE
