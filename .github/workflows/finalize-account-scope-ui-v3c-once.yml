name: Finalize AuthHub Account Scope UI V3C Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-account-scope-ui-v3c-once.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize legacy route and apply native account-scope UI
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old="if(route==='/groups')return window.AuthHubAccountGroups?.render({app,request,toast,loading,navigate,version:cfg.version,providers});"
          new="if(route==='/groups')return window.AuthHubAccountGroupsUI.render({app,state,request,toast,loading,navigate,version:cfg.version});"
          if old not in s:
              raise SystemExit('legacy group route not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 tools/account-scope-ui-v3-public.py
      - name: Exhaustive static behavior and visual-system QA
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check app.js
          grep -q 'ACCOUNT_SCOPE_UI_V3' app.js
          grep -q 'ACCOUNT_SCOPE_UI_V3' styles.css
          grep -q 'Account scope' app.js
          grep -q 'm-account-group' app.js
          grep -q 'data-account-scope' app.js
          grep -q '/admin/account-groups/${encodeURIComponent(effectiveGroupId)}/providers/' app.js
          grep -q 'accountScope:accountGroupId' app.js
          ! grep -q "nav('groups','그룹 관리'" app.js
          ! grep -q 'AuthHubAccountGroupsUI.render' app.js
          ! grep -q 'AuthHubAccountGroups?.render' app.js
          ! grep -q 'account-groups.js' index.html
          ! grep -q 'account-groups.css' index.html
          grep -q -- '--sidebar:#111318' styles.css
          grep -q -- '--accent:#5b5cf0' styles.css
          ! grep -q -- '--green:#087b4d' styles.css
          test "$(tr -d '\r\n' < BUILD_VERSION.txt)" = 'v20260907-113000-KST'
          echo ACCOUNT_SCOPE_UI_V3_EXHAUSTIVE_QA_OK=yes
      - name: Commit final production bundle and clean one-shot tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js styles.css index.html BUILD_VERSION.txt
          git rm -f tools/account-scope-ui-v3-patch.py tools/account-scope-ui-v3-public.py .github/workflows/finalize-account-scope-ui-v3-once.yml .github/workflows/finalize-account-scope-ui-v3b-once.yml .github/workflows/finalize-account-scope-ui-v3c-once.yml
          git commit -m 'Use native AuthHub project account scopes'
          git push origin HEAD:main
