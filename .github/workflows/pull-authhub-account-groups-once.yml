name: Pull AuthHub Account Groups Once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pull-authhub-account-groups-once.yml']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fetch private AuthHub source with workflow token and publish exact build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/authhub-source
          git clone "https://x-access-token:${GH_TOKEN}@github.com/suaveforge/authhub.git" /tmp/authhub-source
          cd /tmp/authhub-source
          VERSION="$(tr -d '\r\n' < VERSION)"
          node tools/build-web.cjs --api-base 'https://api-authhub.suaveforge.com' --web-domain 'authhub.suaveforge.com' --version "$VERSION"
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/authhub-source/dist/web/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Deploy AuthHub Account Groups $VERSION" || true
          git push origin HEAD:main
          echo "DEPLOYED_VERSION=$VERSION"
