name: Publish AuthHub Admin V2 Once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-authhub-admin-v2-once.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, suaveforge-deploy, server123]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish staged canonical admin assets
        shell: bash
        run: |
          set -Eeuo pipefail
          STAGE=/home/authhub-admin-v2-web
          test -s "$STAGE/app.js"
          test -s "$STAGE/styles.css"
          test -s "$STAGE/index.html"
          grep -q 'ADMIN_MANAGEMENT_V2_UI' "$STAGE/app.js"
          grep -q 'ADMIN_MANAGEMENT_V2_STYLES' "$STAGE/styles.css"
          grep -q '20260907-admin2' "$STAGE/index.html"
          install -m 0644 "$STAGE/app.js" app.js
          install -m 0644 "$STAGE/styles.css" styles.css
          install -m 0644 "$STAGE/index.html" index.html
          node --check app.js
          git config user.name 'authhub-deploy-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js styles.css index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish service-scoped users and paged audit console'
            git push origin HEAD:main
          fi
          echo AUTHHUB_ADMIN_V2_STATIC_COMMIT_OK=yes
      - name: Verify public console
        shell: bash
        run: |
          set -Eeuo pipefail
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 10 -o /tmp/authhub-admin-v2-index.html https://authhub.suaveforge.com/ \
              && grep -q 'app.js?v=20260907-admin2' /tmp/authhub-admin-v2-index.html \
              && curl -fsS --max-time 10 -o /tmp/authhub-admin-v2-app.js 'https://authhub.suaveforge.com/app.js?v=20260907-admin2' \
              && grep -q 'ADMIN_MANAGEMENT_V2_UI' /tmp/authhub-admin-v2-app.js \
              && grep -q 'userPageSize: 25' /tmp/authhub-admin-v2-app.js \
              && grep -q 'auditPageSize: 50' /tmp/authhub-admin-v2-app.js \
              && grep -q 'AuthHub 계정 완전 삭제' /tmp/authhub-admin-v2-app.js; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" = 1
          echo AUTHHUB_ADMIN_V2_PUBLIC_OK=yes
